component_types:
  - BaseType:
      extends: "-"
      description: "The default component type from which all other component types derive."
      properties: []
      operations: []
  - CloudProvider:
      extends: "BaseType"
      description: "The cloud infrastructure of a provider, on which cloud services and other resources are deployed on demand."
      properties: []
      operations: []
  - Storage:
      extends: "BaseType"
      description: "A storage volume that is attached to a component and holds the component's data persistently."
      properties:
        - storage_size:
            type: "STRING"
            description: "The capacity of the storage volume."
            required: true
            default_value: ""
      operations: []
  - SoftwareApplication:
      extends: "BaseType"
      description: "Software that is deployed on another component and provides functionality to users or other components."
      properties: []
      operations: []
  - DatabaseSystem:
      extends: "SoftwareApplication"
      description: "A system that stores and manages data and provides access to it through an interface."
      properties: []
      operations: []
  - MessageBroker:
      extends: "SoftwareApplication"
      description: "An intermediary that receives messages from sending components and delivers them to receiving components."
      properties: []
      operations: []
  - Compute:
      extends: "BaseType"
      description: "A physical or virtual machine on which any software can be deployed."
      properties: []
      operations: []
  - Platform:
      extends: "BaseType"
      description: "A system on which other components are deployed in a form that the system defines, such as container images or application code, and which provides the resources that these components use."
      properties: []
      operations: []
  - ContainerPlatform:
      extends: "Platform"
      description: "A platform on which components are deployed as containers."
      properties: []
      operations: []
  - DockerEngine:
      extends: "ContainerPlatform"
      description: "A Docker Engine, on which components are deployed as Docker containers."
      properties: []
      operations: []
  - KubernetesCluster:
      extends: "ContainerPlatform"
      description: "A set of machines, called nodes, managed by a Kubernetes control plane, on which components are deployed as pods."
      properties: []
      operations: []
